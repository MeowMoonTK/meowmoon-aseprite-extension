name: One-time Hue Shift v0.1.5 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hue-shift-release-015.yml"

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-hue-shift-v0.1.5]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify requested version and public update implementation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("extensions/hue-shift/package.json").read_text(encoding="utf-8"))
          assert manifest["name"] == "meowmoon-hue-shift"
          assert manifest["version"] == "0.1.5"
          updater = Path("extensions/hue-shift/src/autoupdate.ps1").read_text(encoding="utf-8")
          assert "Invoke-RestMethod" in updater and "Invoke-WebRequest" in updater
          assert "gh auth" not in updater and "& gh release" not in updater
          PY
      - name: Run Lua regression tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          lua5.4 tests/test_hue_shift.lua
          lua5.4 tests/test_wheel.lua
          lua5.4 tests/test_startup.lua
      - name: Build, validate, and checksum extension
        run: |
          python3 scripts/build_hue_shift.py
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          path = Path("dist/hue-shift-0.1.5.aseprite-extension")
          assert path.is_file(), "Missing release package"
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              assert set(archive.namelist()) == {
                  "package.json", "main.lua", "src/color.lua", "src/ramp.lua",
                  "src/palette.lua", "src/wheel.lua", "src/dialog.lua", "src/autoupdate.ps1"
              }
              manifest = json.loads(archive.read("package.json"))
              assert manifest["name"] == "meowmoon-hue-shift"
              assert manifest["version"] == "0.1.5"
              assert b"plugin.version" in archive.read("main.lua")
          PY
          ( cd dist && sha256sum hue-shift-0.1.5.aseprite-extension > hue-shift-0.1.5.sha256 )
      - name: Publish owner-requested GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "hue-shift-v0.1.5" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists. Refusing to overwrite artifacts."
            exit 1
          fi
          gh release create "hue-shift-v0.1.5" \
            "dist/hue-shift-0.1.5.aseprite-extension" \
            "dist/hue-shift-0.1.5.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hue Shift v0.1.5" \
            --notes "Public-release updater: no GitHub CLI, token, or scheduled task required. Automatically checks at Aseprite startup on Windows, verifies SHA-256, and installs newer released packages. Existing v0.1.3/v0.1.4 installations using the old GitHub CLI updater must manually install v0.1.5 once to switch to the new mechanism."
