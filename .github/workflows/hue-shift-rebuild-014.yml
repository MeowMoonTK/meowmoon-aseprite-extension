name: Requested Hue Shift v0.1.4 rebuild

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hue-shift-rebuild-014.yml"

permissions:
  contents: read

jobs:
  rebuild:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[rebuild-hue-shift-v0.1.4]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and test the source revision
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          lua5.4 tests/test_hue_shift.lua
          lua5.4 tests/test_wheel.lua
          lua5.4 tests/test_startup.lua
      - name: Build Hue Shift 0.1.4 and validate panel-version change
        run: |
          python3 scripts/build_hue_shift.py
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          path = Path("dist/hue-shift-0.1.4.aseprite-extension")
          assert path.exists()
          with zipfile.ZipFile(path) as package:
              assert package.testzip() is None
              manifest = json.loads(package.read("package.json"))
              assert manifest["version"] == "0.1.4"
              names = set(package.namelist())
              assert names == {
                  "package.json", "main.lua", "src/color.lua", "src/ramp.lua",
                  "src/palette.lua", "src/wheel.lua", "src/dialog.lua",
                  "src/autoupdate.ps1"
              }
              assert b"plugin.version" in package.read("main.lua")
              assert b'label = "Version:"' in package.read("src/dialog.lua")
          print("Requested package verified:", path)
          PY
          ( cd dist && sha256sum hue-shift-0.1.4.aseprite-extension > hue-shift-0.1.4.sha256 )
      - name: Replace assets in existing private v0.1.4 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "hue-shift-v0.1.4" \
            "dist/hue-shift-0.1.4.aseprite-extension" \
            "dist/hue-shift-0.1.4.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "hue-shift-v0.1.4" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | .name'
