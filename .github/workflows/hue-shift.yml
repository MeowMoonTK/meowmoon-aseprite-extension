name: Hue Shift tests

on:
  push:
    paths:
      - "extensions/hue-shift/**"
      - "tests/test_hue_shift.lua"
      - "tests/test_wheel.lua"
      - "tests/test_startup.lua"
      - "tests/test_update.lua"
      - "tests/test_update_tools.ps1"
      - ".github/workflows/hue-shift.yml"
  pull_request:
    paths:
      - "extensions/hue-shift/**"
      - "tests/test_hue_shift.lua"
      - "tests/test_wheel.lua"
      - "tests/test_startup.lua"
      - "tests/test_update.lua"
      - "tests/test_update_tools.ps1"
      - ".github/workflows/hue-shift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Run Lua regression tests
        run: |
          lua5.4 tests/test_hue_shift.lua
          lua5.4 tests/test_wheel.lua
          lua5.4 tests/test_startup.lua
          lua5.4 tests/test_update.lua

  native-updater-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify curl download and Windows SHA-256 tool
        shell: powershell
        run: ./tests/test_update_tools.ps1
      - name: Check public release metadata with curl
        shell: powershell
        run: |
          $body = & curl.exe -q --fail --location --silent --show-error --connect-timeout 5 --max-time 15 --max-filesize 1048576 --user-agent MeowMoon-HueShift 'https://api.github.com/repos/MeowMoonTK/meowmoon-aseprite-extension/releases?per_page=100'
          if ($LASTEXITCODE -ne 0) { throw 'Public metadata request failed' }
          $releases = $body | ConvertFrom-Json
          if (-not @($releases | Where-Object { $_.tag_name -match '^hue-shift-v' }).Count) { throw 'No Hue Shift Release in metadata' }
# CI does not publish Releases.
