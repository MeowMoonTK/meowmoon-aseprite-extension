name: Hue Shift tests

on:
  push:
    paths:
      - "extensions/hue-shift/**"
      - "tests/test_hue_shift.lua"
      - "tests/test_wheel.lua"
      - "tests/test_startup.lua"
      - ".github/workflows/hue-shift.yml"
  pull_request:
    paths:
      - "extensions/hue-shift/**"
      - "tests/test_hue_shift.lua"
      - "tests/test_wheel.lua"
      - "tests/test_startup.lua"
      - ".github/workflows/hue-shift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Run Lua regression tests
        run: |
          lua5.4 tests/test_hue_shift.lua
          lua5.4 tests/test_wheel.lua
          lua5.4 tests/test_startup.lua

  public-updater-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $tokens = $null
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'extensions/hue-shift/src/autoupdate.ps1').Path,
            [ref]$tokens,[ref]$errorsFound
          ) | Out-Null
          if ($errorsFound.Count -gt 0) { throw ($errorsFound | Out-String) }
          $source = Get-Content 'extensions/hue-shift/src/autoupdate.ps1' -Raw
          if ($source -match '(?m)^\s*&\s*gh\s' -or $source -match 'gh auth') { throw 'Legacy GitHub CLI call remains' }
          Write-Host 'PowerShell 5.1 syntax and no-gh dependency OK.'
      - name: Unauthenticated public GitHub Release download and install
        shell: powershell
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'hue-shift-public-check'
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          $target = Join-Path $temp 'meowmoon-hue-shift'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          '{"name":"meowmoon-hue-shift","version":"0.1.3"}' | Set-Content -LiteralPath (Join-Path $target "package.json") -Encoding UTF8
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File 'extensions/hue-shift/src/autoupdate.ps1' -InstallDir $target
          if ($LASTEXITCODE -ne 0) { throw 'Public update check failed' }
          $installed = Get-Content (Join-Path $target 'package.json') -Raw | ConvertFrom-Json
          if ([version]$installed.version -le [version]'0.1.3') { throw 'A newer public Release was not installed' }
          if (-not (Test-Path (Join-Path $target 'src/autoupdate.ps1'))) { throw 'Updater missing from installed package' }
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File 'extensions/hue-shift/src/autoupdate.ps1' -InstallDir $target
          if ($LASTEXITCODE -ne 0) { throw 'Idempotent public update check failed' }
          Write-Host ('Public GitHub Release updated dummy package to v' + $installed.version)

# Tests only; never build or publish a Release automatically.
