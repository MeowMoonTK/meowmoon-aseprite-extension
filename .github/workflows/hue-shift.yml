name: Hue Shift tests

on:
  push:
    paths:
      - "extensions/hue-shift/**"
      - "tests/test_hue_shift.lua"
      - "tests/test_wheel.lua"
      - "tests/test_startup.lua"
      - ".github/workflows/hue-shift.yml"
  pull_request:
    paths:
      - "extensions/hue-shift/**"
      - "tests/test_hue_shift.lua"
      - "tests/test_wheel.lua"
      - "tests/test_startup.lua"
      - ".github/workflows/hue-shift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Run Lua regression tests
        run: |
          lua5.4 tests/test_hue_shift.lua
          lua5.4 tests/test_wheel.lua
          lua5.4 tests/test_startup.lua

  native-updater-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell downloader and native-install separation
        shell: powershell
        run: |
          $file = 'extensions/hue-shift/src/check-release.ps1'
          $tokens = $null
          $syntaxErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file).Path,[ref]$tokens,[ref]$syntaxErrors
          ) | Out-Null
          if ($syntaxErrors.Count -gt 0) { throw ($syntaxErrors | Out-String) }
          $source = Get-Content $file -Raw
          if ($source -match '\bInstallDir\b' -or $source -match '\buninstallExtension\b') {
            throw 'Updater must not manipulate the extension install directory'
          }
          if ($source -match '\bExtractToDirectory\b') {
            throw 'Extension extraction must be left to Aseprite'
          }
          if (-not ((Get-Content 'extensions/hue-shift/src/update.lua' -Raw) -match 'app.command.Options')) {
            throw 'Lua must use the Aseprite native installer'
          }
          Write-Host 'Downloader is syntax-valid and cannot replace installed extension.'
      - name: Verify public GitHub Release download and SHA256 without installing
        shell: powershell
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'Hue Shift Native Update Test'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $resultFile = Join-Path $folder 'status.json'
          $sourceManifest = (Get-Content 'extensions/hue-shift/package.json' -Raw)
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'extensions/hue-shift/src/check-release.ps1' -CurrentVersion '0.1.5' -ResultFile $resultFile
          if ($LASTEXITCODE -ne 0) { throw 'Public Release download or SHA-256 validation failed' }
          $result = Get-Content -LiteralPath $resultFile -Raw | ConvertFrom-Json
          if ($result.status -ne 'update') { throw ('Expected verified update, got: ' + $result.status + ' ' + $result.message) }
          if (-not (Test-Path -LiteralPath $result.packagePath)) { throw 'Updater did not provide an installation package' }
          if ([IO.Path]::GetExtension($result.packagePath) -ne '.aseprite-extension') { throw 'Invalid downloaded extension file' }
          if ((Get-Content 'extensions/hue-shift/package.json' -Raw) -ne $sourceManifest) {
            throw 'Download helper modified installed manifest'
          }
          if (-not (Test-Path 'extensions/hue-shift/src/check-release.ps1')) { throw 'Updater file disappeared' }
          Write-Host ('Verified v' + $result.version + ' as native installer input: ' + $result.packagePath)
      - name: No update when already ahead, and report invalid version errors
        shell: powershell
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'Hue Shift Native Update Test'
          $resultFile = Join-Path $folder 'up-to-date.json'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'extensions/hue-shift/src/check-release.ps1' -CurrentVersion '99.0.0' -ResultFile $resultFile
          if ($LASTEXITCODE -ne 0) { throw 'Up-to-date check failed' }
          $result = Get-Content -LiteralPath $resultFile -Raw | ConvertFrom-Json
          if ($result.status -ne 'up_to_date') { throw 'Expected no update when installed version is ahead' }
          $badResult = Join-Path $folder 'invalid.json'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'extensions/hue-shift/src/check-release.ps1' -CurrentVersion 'invalid' -ResultFile $badResult
          if ($LASTEXITCODE -eq 0) { throw 'Invalid version should fail' }
          $errorStatus = Get-Content -LiteralPath $badResult -Raw | ConvertFrom-Json
          if ($errorStatus.status -ne 'error') { throw 'Invalid input did not report an error status' }
      - name: Test real detached Windows launcher with a spaced path
        shell: powershell
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'Hue Shift Detached Native Update'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $status = Join-Path $folder 'detached-status.json'
          $script = (Resolve-Path 'extensions/hue-shift/src/check-release.ps1').Path
          $cmd = 'start "" /min powershell.exe -WindowStyle Hidden -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' + $script + '" -CurrentVersion "99.0.0" -ResultFile "' + $status + '"'
          & cmd.exe /d /c $cmd
          for ($i=0; $i -lt 140 -and -not (Test-Path -LiteralPath $status); $i++) {
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path -LiteralPath $status)) { throw 'Detached launch never returned a result' }
          $result = Get-Content -LiteralPath $status -Raw | ConvertFrom-Json
          if ($result.status -ne 'up_to_date') { throw ('Detached launcher failed: ' + $result.message) }
          Write-Host 'Detached Windows launcher delivered a readable status to Lua.'
# CI performs tests only. Building and publishing require an explicit request.
