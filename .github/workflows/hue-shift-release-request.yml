name: Requested Hue Shift release

on:
  push:
    branches: [main]
    paths:
      - "extensions/hue-shift/package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-v0-1-4:
    # Only this exact explicitly requested release commit will publish.
    # Future pushes to main, including future version changes, will not build.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[build-hue-shift-v0.1.4]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested version
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path("extensions/hue-shift/package.json").read_text())["version"]
          assert version == "0.1.4", f"Wrong release version: {version}"
          PY
      - name: Run regression tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          lua5.4 tests/test_hue_shift.lua
          lua5.4 tests/test_wheel.lua
          lua5.4 tests/test_startup.lua
      - name: Build and verify installable extension
        run: |
          python3 scripts/build_hue_shift.py
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          p=Path("dist/hue-shift-0.1.4.aseprite-extension")
          assert p.is_file(), 'Archive not created'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert set(z.namelist()) == {"package.json", "main.lua", "src/color.lua", "src/ramp.lua", "src/palette.lua", "src/wheel.lua", "src/dialog.lua", "src/autoupdate.ps1"}
              m=json.loads(z.read("package.json"))
              assert m["version"] == "0.1.4"
              assert m["contributes"]["scripts"][0]["path"] == "./main.lua"
          PY
          ( cd dist && sha256sum hue-shift-0.1.4.aseprite-extension > hue-shift-0.1.4.sha256 )
      - name: Create private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "hue-shift-v0.1.4" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; no overwrite."
            exit 0
          fi
          gh release create "hue-shift-v0.1.4" \
            "dist/hue-shift-0.1.4.aseprite-extension" \
            "dist/hue-shift-0.1.4.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hue Shift v0.1.4" \
            --notes "Fix: remove the arbitrary 256-slot limit from Add to Palette. Existing Hue Shift styles, preview, and private Release check remain unchanged."
